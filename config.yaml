telegram:
  token: "TOKEN_BOT_API"
  channel_id: "CHANNEL_ID"
  alert_chat_id: ""   # Your personal chat ID for error DMs (send /start to the bot first)

deepl:
  api_key: "DEEPL_API_KEY"

twitter:
  max_messages_per_cycle: 3
  accounts: # Twitter account - handle for @username
    - handle: "federalreserve"
      label: "Federal Reserve"
  poll_interval_minutes: 10

economic_calendar:
  countries: [USD, EUR, GBP, JPY]
  min_impact: medium          # medium | high
  check_interval_minutes: 60

claude:
  api_key: "ANTHROPIC_API_KEY" # Useful to sum up or check relevance of a tweet, optional
